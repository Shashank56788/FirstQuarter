name: Midnight Allowlist CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Compact Contracts & TypeScript Packages
        run: npm run build

      - name: Execute Vitest Test Suite (Unit & ZK Circuits)
        run: npm test

      - name: Verify Privacy Model & Zero Identity Leakage Assertions
        run: npx vitest run contract/src/allowlist.test.ts
